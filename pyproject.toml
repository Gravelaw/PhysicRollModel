[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "physicroll"
version = "0.3.0.dev1"
description = "Synthetic offline cold rolling demonstrator"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[tool.setuptools]
packages = ["physicroll"]

[tool.setuptools.package-data]
physicroll = [
  "_resources/examples/*.json",
  "_resources/schemas/*.json",
  "_resources/shao_fixture/*.json",
  "_resources/shao_fixture/*.csv",
  "_resources/shao_research/*.json",
]
