name: Source checks

on:
  pull_request:
  push:
    branches:
      - main
      - dev/**

permissions:
  contents: read

jobs:
  python-source:
    name: ${{ matrix.os }} Python ${{ matrix.python-version }} source and wheel tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install schema test dependency
        run: python -m pip install jsonschema==4.26.0
      - name: Check installed test dependency
        run: python -m pip check
      - name: Verify bundled assets and baseline
        run: python scripts/smoke.py
      - name: Run source tests
        run: python -m unittest discover -s tests -q
      - name: Preserve legacy positional command
        run: python -m physicroll scenarios/baseline.json > baseline-result.json
      - name: Run checked RunSpec command
        run: python -m physicroll --run-spec scenarios/v1_checked_pass.runspec.json --output checked-result.json
      - name: Verify installed wheel outside checkout
        run: python scripts/check_installed_wheel.py
